name: Docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Never cancel a deploy midway; do cancel superseded PR builds.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Builds the site, then audits every internal link and #anchor in the output.
      # VitePress alone only verifies that target pages exist, not that anchors do — and most
      # of this site is assembled by including regions of the root README, so a reworded
      # heading is the likeliest way for it to rot.
      - run: pnpm docs:check

      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: docs/.vitepress/dist

  deploy:
    name: Deploy to Pages
    # PRs build but do not deploy — a fork PR must never be able to publish to the site.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
