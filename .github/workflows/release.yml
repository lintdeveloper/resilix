name: Release

on:
  push:
    branches: [main]
  # Re-triggerable by hand. The publish is driven by a push to main, and a push produces exactly
  # one chance to run it: if Actions is unavailable when the release commit lands — as during the
  # 2026-08-26 major outage — no run is ever created, changesets has already consumed its
  # changesets, and the version sits on main with nothing on npm. Without this the only recovery
  # is pushing another commit to main purely to fire the event.
  #
  # Safe to expose: `changeset publish` is a no-op for a version that is already on the registry,
  # so an accidental dispatch cannot republish or overwrite anything.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: changesets/action@v1
        with:
          version: pnpm ci:version
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # changesets/action decides how to authenticate by looking for NPM_TOKEN specifically.
          # With only NODE_AUTH_TOKEN set it logged "No NPM_TOKEN found, but OIDC is available"
          # and attempted trusted publishing, which fails until a trusted publisher exists for
          # the package. setup-node had already written the token into .npmrc, so the publish
          # authenticated anyway — but the log said the opposite of what was happening.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Provenance attests that the artifact was built from this commit in this repo.
          # It requires a public repository, which this now is. Note this is independent of how
          # the publish authenticates: both use the job's OIDC identity, but provenance only
          # SIGNS the artifact, it does not log in.
          NPM_CONFIG_PROVENANCE: "true"
          # MIGRATE BEFORE JANUARY 2027. This publishes with a granular access token that has
          # bypass-2FA enabled, which npm is retiring: such tokens already cannot perform account
          # management, and around Jan 2027 they lose direct publish, downgrading to staged
          # publishes that need manual 2FA approval. The replacement is trusted publishing —
          # `npm trust github resilix --repo lintdeveloper/resilix --file release.yml
          # --allow-publish` — after which NPM_TOKEN and both env lines above can be deleted.
